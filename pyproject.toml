[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineoa"
version = "7.7.18"
description = "LINE Official User API wrapper library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "madoa5561" }
]
keywords = ["LINE", "API", "bot", "messaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "requests>=2.32.5",
  "aiohttp>=3.13.3"
]

[project.optional-dependencies]
interactive-login = [
  "playwright>=1.40"
]

[tool.setuptools.packages.find]
include = ["LINELib*"]

[project.urls]
Homepage = "https://github.com/madoa5561/LINELib"
Repository = "https://github.com/madoa5561/LINELib"
Issues = "https://github.com/madoa5561/LINELib/issues"
